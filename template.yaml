AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: AWS SAM template migrating golab backend service from EC2 to AWS Lambda

Globals:
  Function:
    Timeout: 30
    MemorySize: 512
    Architectures:
      - arm64

Resources:
  BackendFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: backend/
      Handler: bootstrap
      Runtime: provided.al2023
      Environment:
        Variables:
          ENVIRONMENT: production
          PORT: "8080"
      Events:
        RootRoute:
          Type: HttpApi
          Properties:
            Path: /
            Method: ANY
        ProxyRoute:
          Type: HttpApi
          Properties:
            Path: /{proxy+}
            Method: ANY

Outputs:
  ApiUrl:
    Description: "Live Public HTTP API Gateway Endpoint URL"
    Value: !Sub "https://${ServerlessHttpApi}.execute-api.${AWS::Region}.amazonaws.com"
  FunctionArn:
    Description: "Lambda Function ARN"
    Value: !GetAtt BackendFunction.Arn
