AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  Serverless migration of backend service to AWS Lambda with decoupled Docker execution via ECS Fargate.

Globals:
  Function:
    Timeout: 30
    MemorySize: 512
    Runtime: provided.al2023
    Handler: lambda_main
    CodeUri: backend/
    Tracing: Active

Resources:
  BackendFunction:
    Type: AWS::Serverless::Function
    Properties:
      Events:
        ApiProxy:
          Type: Api
          Properties:
            Path: /{proxy+}
            Method: ANY

  # Decoupled worker for Docker commands (runs on ECS Fargate)
  DockerTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      RequiresCompatibilities:
        - FARGATE
      Cpu: '256'
      Memory: '512'
      NetworkMode: awsvpc
      ExecutionRoleArn: !GetAtt ECSTaskExecutionRole.Arn
      ContainerDefinitions:
        - Name: docker-runner
          Image: <YOUR_DOCKER_RUNNER_IMAGE>
          Essential: true
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: docker-runner

  ECSTaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy

  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      RetentionInDays: 7

Outputs:
  BackendFunctionArn:
    Description: ARN of the Lambda function handling HTTP requests
    Value: !GetAtt BackendFunction.Arn
  DockerTaskDefinitionArn:
    Description: ARN of the ECS Fargate task definition for Docker execution
    Value: !Ref DockerTaskDefinition
